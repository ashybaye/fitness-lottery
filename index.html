<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>30-Day Fitness Challenge Deck</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🃏 30-Day Fitness Challenge Deck</h1>
    <p id="status-line" class="status-line" aria-live="polite">Loading board…</p>
    <button id="reset-btn" type="button" class="reset-btn">🔄 Reset board</button>
  </header>

  <main>
    <div id="board" class="board" aria-label="Fitness challenge cards"></div>
  </main>

  <footer class="app-footer">
    <p>Pick a card, take on the challenge. Once opened, a card stays revealed for good. Only 1 card can be opened per day for everyone sharing this board.</p>
  </footer>

  <div id="zoom-overlay" class="zoom-overlay" aria-hidden="true">
    <div class="zoom-card" role="dialog" aria-modal="true" aria-labelledby="zoom-text">
      <div id="zoom-number" class="zoom-number"></div>
      <div id="zoom-text" class="zoom-text"></div>
      <button id="zoom-lets-go-btn" type="button" class="lets-go-btn zoom-lets-go-btn">Let's go! 💪</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
